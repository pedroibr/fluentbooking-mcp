name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Nome exato do Worker no Cloudflare"
        required: true
        type: string
      deploy_message:
        description: "Mensagem opcional para a versao publicada"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler deploy
          --name "${{ inputs.worker_name }}"
          --keep-vars
          --message "${{ inputs.deploy_message || format('GitHub deploy for {0}', inputs.worker_name) }}"
